name: Build offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK from GitHub runner
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate game scripts
        run: |
          node --check app/src/main/assets/art.js
          node --check app/src/main/assets/game.js

      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare installable file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BazeRPG-offline-debug.apk
          sha256sum dist/BazeRPG-offline-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BazeRPG-offline-Android-APK
          path: dist/*
          if-no-files-found: error

      - name: Publish direct APK download to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 --target "$GITHUB_SHA" --title "Baze RPG v0.1.0 — офлайн Android" --notes "Тестовая APK-сборка: автобои, четыре области, классы, добыча предметов, инвентарь и заточка. Работает без интернета."
          fi
          gh release upload v0.1.0 dist/BazeRPG-offline-debug.apk dist/SHA256SUMS.txt --clobber
