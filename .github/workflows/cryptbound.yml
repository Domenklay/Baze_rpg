name: Build Cryptbound Offline APK
on:
  push:
    branches: [main]
    paths:
      - 'cryptbound/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/cryptbound.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptbound-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate original artwork and game scripts
        run: |
          node --check cryptbound/src/main/assets/art.js
          node --check cryptbound/src/main/assets/equipment_art.js
          node --check cryptbound/src/main/assets/titles.js
          node --check cryptbound/src/main/assets/gumballs_titles_reference.js
          node --check cryptbound/src/main/assets/titles_runtime.js
          node --check cryptbound/src/main/assets/sprite_catalog.js
          node --check cryptbound/src/main/assets/imported_art.js
          node --check cryptbound/src/main/assets/combat_feedback.js
          node --check cryptbound/src/main/assets/hunter_bestiary.js
          node --check cryptbound/src/main/assets/forest_encounters.js
          node --check cryptbound/src/main/assets/t1_encounters.js
          node --check cryptbound/src/main/assets/mining.js
          node --check cryptbound/src/main/assets/ridge_catalog.js
          node --check cryptbound/src/main/assets/ridge_events.js
          node --check cryptbound/src/main/assets/game.js
          node --check cryptbound/src/main/assets/dungeons.js
          node --check cryptbound/src/main/assets/clicker_rules.js
          node --check cryptbound/src/main/assets/systems.js
          node --check cryptbound/src/main/assets/boss_scripts.js
          node --check cryptbound/src/main/assets/story_events.js
          node --check cryptbound/src/main/assets/balance.js
          node cryptbound/tests/smoke.cjs
          node cryptbound/tests/titles_v2.cjs
          node cryptbound/tests/path_items_regression.cjs
          node cryptbound/tests/shadow_echo.cjs
          node cryptbound/tests/titles_panther.cjs
          node cryptbound/tests/all_title_paths.cjs
          node cryptbound/tests/combat_hud_v082.cjs
          node cryptbound/tests/hunter_book.cjs
          node cryptbound/tests/forest_events.cjs
          node cryptbound/tests/t1_encounters.cjs
          node cryptbound/tests/mining.cjs
          node cryptbound/tests/ridge_events.cjs
          node cryptbound/tests/hunter_book_visual.cjs
          node cryptbound/tests/ui_baseline.cjs
          node cryptbound/tests/sprites.cjs
          node cryptbound/tests/equipment_icons.cjs

      - name: Compile playable Android app
        run: gradle :cryptbound:assembleDebug --no-daemon

      - name: Gather APK
        run: |
          mkdir -p dist
          cp cryptbound/build/outputs/apk/debug/cryptbound-debug.apk dist/Cryptbound-v0.8.13-offline-Android.apk
          sha256sum dist/Cryptbound-v0.8.13-offline-Android.apk > dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cryptbound-Offline-Android
          path: dist/*
          if-no-files-found: error

      - name: Publish standalone APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view cryptbound-v0.8.13 >/dev/null 2>&1; then
            gh release create cryptbound-v0.8.13 --target "$GITHUB_SHA" --title "Пепельный лабиринт v0.8.13 — кирка нагорья и паутинка 18 навыков" --notes "Cryptbound v0.8.13 offline Android. Каменистое нагорье: 50 новых взаимосвязанных событий с уникальной экипировкой, рабочими расходниками, торговлей и улучшениями деревни. Зафиксированная сквозная штольня на этажах X, X+10 и X+20 с переходами назад на 10 и вперёд на 20 этажей. Кнопка подъёма на предыдущий этаж полностью регенерирует врагов, руду, сундуки и случайные события, но сохраняет уникальные находки и этапы штольни. На уже побеждённом этаже босса две двери: на базу и дальше; повторного босса нет. Одноразовый Грохочущий бур привлекает 1–2 эфирных элитников на новых этажах, усиливается по мере спуска и выдаёт богатую награду рудой после победы. Эфирные элитники не имеют дропа и не учитываются в обычных трофеях. При подъёме бур теряется, при остановке не перезапускается. Старые сохранения поддерживаются."
          fi
          gh release upload cryptbound-v0.8.13 dist/Cryptbound-v0.8.13-offline-Android.apk dist/SHA256SUMS.txt --clobber
