name: Import original Clicker resource art to Cryptbound
on:
  push:
    branches: [main]
    paths:
      - 'cryptbound/scripts/import_concept_art.cjs'
      - '.github/workflows/import-clicker-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptbound-original-clicker-art-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact original concept PNGs as offline embedded sprites
        run: node cryptbound/scripts/import_concept_art.cjs
      - name: Commit verified art and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cryptbound/src/main/assets/concept_materials.js cryptbound/src/main/assets/imported/concepts/
          if ! git diff --cached --quiet; then
            git commit -m "Import verified exact resource art from RPG Clicker Infinity"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Resource art already up to date"
          fi
