<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100b0c">
<title>Baze RPG: Осквернённые земли</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
  <header id="top">
    <div class="top-title"><div class="crest">✥</div>
      <div><div class="brand">BAZE RPG</div><div class="tagline">ОСКВЕРНЁННЫЕ ЗЕМЛИ · OFFLINE</div></div>
    </div>
    <div class="resources">
      <span title="Осколки железа"><b>◈</b> <strong id="res-scrap">0</strong></span>
      <span title="Пепел"><b class="ember">✦</b> <strong id="res-ember">0</strong></span>
    </div>
  </header>
  <div id="hero-strip">
    <div class="level-disk" id="level-chip">1</div>
    <div class="grow"><div id="hero-name" class="hero-name">Безымянный</div>
      <div class="progress"><i id="xp-bar" class="xp-fill"></i></div>
      <div id="xp-label" class="muted tiny">0 / 40 опыта</div>
    </div>
    <button class="sound-btn" data-action="pause" title="Приостановить автобой"><span id="play-symbol">Ⅱ</span></button>
  </div>
  <main id="screen"></main>
  <nav id="tabs" aria-label="Разделы">
    <button data-tab="battle" class="active"><span>⚔</span><small>Бой</small></button>
    <button data-tab="hero"><span>♜</span><small>Герой</small></button>
    <button data-tab="bag"><span>▦</span><small>Вещи</small></button>
    <button data-tab="forge"><span>⚒</span><small>Кузница</small></button>
    <button data-tab="map"><span>✥</span><small>Карта</small></button>
  </nav>
</div>
<div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="art.js"></script>
<script src="game.js"></script>
</body></html>
